name: CCS
options:
  bundleIdPrefix: com.mawena
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "38"
    SWIFT_VERSION: "5.9"
packages:
  # émulateur de terminal (VT100/xterm) du terminal intégré
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.10.1
targets:
  CCS:
    type: application
    platform: iOS
    sources: [CCS]
    dependencies:
      - package: SwiftTerm
    info:
      path: CCS/Info.plist
      properties:
        CFBundleDisplayName: CCS
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        # « Ouvrir dans CCS » depuis la feuille de partage d'iOS (fichiers de tout type)
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Fichier
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.data, public.content, public.item]
        # ccs://partager?texte=… (raccourci « Partager vers CCS » pour le texte et les liens)
        CFBundleURLTypes:
          - CFBundleURLName: com.mawena.ccs
            CFBundleURLSchemes: [ccs]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mawena.ccs
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
  CCSTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CCSTests]
    dependencies:
      - target: CCS
