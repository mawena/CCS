name: CCS
options:
  bundleIdPrefix: com.mawena
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.8.1"
    CURRENT_PROJECT_VERSION: "43"
    SWIFT_VERSION: "5.9"
packages:
  # émulateur de terminal (VT100/xterm) du terminal intégré
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.10.1
targets:
  CCS:
    type: application
    platform: iOS
    sources: [CCS]
    dependencies:
      - package: SwiftTerm
      # extension de diffusion ReplayKit (son de l'iPhone vers le réseau maillé), dans CCS.app/PlugIns
      - target: Diffusion
        embed: true
    # groupe d'applis partagé avec l'extension (cible de la diffusion) ; seul droit demandé,
    # SideStore le crée avec un identifiant Apple gratuit
    entitlements:
      path: CCS/CCS.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mawena.ccs]
    info:
      path: CCS/Info.plist
      properties:
        CFBundleDisplayName: CCS
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        # son partagé : la sortie audio continue de jouer appli en arrière-plan
        UIBackgroundModes: [audio]
        NSLocalNetworkUsageDescription: "CCS reçoit en direct le son des autres appareils du réseau maillé pour le jouer sur cet iPhone."
        # dictée dans la saisie du chat (micro + reconnaissance vocale fr-FR), bouton « Parler à Jarvis »
        NSMicrophoneUsageDescription: "CCS utilise le micro pour dicter tes messages à Claude et pour parler à Jarvis."
        NSSpeechRecognitionUsageDescription: "CCS transcrit ta voix en texte dans la saisie du chat ; rien n'est envoyé sans que tu touches « Envoyer »."
        # « Ouvrir dans CCS » depuis la feuille de partage d'iOS (fichiers de tout type)
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Fichier
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.data, public.content, public.item]
        # ccs://partager?texte=… (raccourci « Partager vers CCS » pour le texte et les liens),
        # ccs://jarvis (écran Jarvis en écoute), jarvis://pair?… (QR code de « jarvis pair »)
        CFBundleURLTypes:
          - CFBundleURLName: com.mawena.ccs
            CFBundleURLSchemes: [ccs, jarvis]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mawena.ccs
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
  # extension de diffusion ReplayKit : le son des applis de l'iPhone, en Opus/RTP vers une sortie
  # du réseau maillé (docs/audio.md). Partage le transport, le codec et le groupe avec l'appli.
  Diffusion:
    type: app-extension
    platform: iOS
    sources:
      - Diffusion
      - CCS/Logique/Rtp.swift
      - CCS/Son/GroupeSon.swift
      - CCS/Son/CodecOpus.swift
    entitlements:
      path: Diffusion/Diffusion.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mawena.ccs]
    info:
      path: Diffusion/Info.plist
      properties:
        CFBundleDisplayName: CCS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).GestionDiffusion
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mawena.ccs.diffusion
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
  CCSTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CCSTests]
    dependencies:
      - target: CCS
