name: ccs
description: "CCS sur Android : la version web de CCS dans une application."
publish_to: 'none'

# versionName+versionCode : suit la version de CCS.
version: 0.26.0+26

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  # Vue web (et ses réglages propres à Android : choix de fichiers).
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.10.0
  # Adresse du serveur, gardée entre deux lancements.
  shared_preferences: ^2.5.3
  # Envoi de fichiers depuis le gestionnaire de fichiers du web.
  file_picker: ^10.3.0
  # Liens externes ouverts dans le navigateur.
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
