# Construction de l'appli iPhone (ios-app/) sur Codemagic, sans signature :
# l'.ipa produit est signé sur le téléphone par SideStore (identifiant Apple gratuit).
workflows:
  ios-natif:
    name: CCS iPhone
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    triggering:
      events: [push, tag]
      branch_patterns:
        - pattern: 'feature/ios-*'
        - pattern: 'develop'
      tag_patterns:
        - pattern: 'v*'
    when:
      changeset:
        includes: ['ios-app/', 'codemagic.yaml']
    scripts:
      - name: Projet Xcode (XcodeGen)
        script: |
          set -o pipefail
          command -v xcodegen || brew install xcodegen
          cd ios-app && xcodegen generate
      - name: Tests unitaires (simulateur)
        script: |
          set -o pipefail
          cd ios-app
          SIMU=$(xcrun simctl list devices available | grep -m1 -o 'iPhone [0-9]* (' | sed 's/ ($//')
          xcodebuild test -project CCS.xcodeproj -scheme CCS \
            -destination "platform=iOS Simulator,name=$SIMU" \
            CODE_SIGNING_ALLOWED=NO | xcpretty || exit 1
      - name: .ipa non signé
        script: |
          set -o pipefail
          cd ios-app
          xcodebuild archive -project CCS.xcodeproj -scheme CCS -configuration Release \
            -archivePath build/CCS.xcarchive -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | xcpretty
          mkdir -p build/Payload
          cp -R build/CCS.xcarchive/Products/Applications/CCS.app build/Payload/
          (cd build && zip -qr CCS.ipa Payload)
    artifacts:
      - ios-app/build/CCS.ipa

  # APK Android (android-app/) : toujours construit ici, plus sur pc-bureau. Signé avec la clé
  # de débogage d'origine (celle de pc-bureau, variable secrète CCS_DEBUG_KEYSTORE du groupe
  # android_signature) pour que la mise à jour s'installe par-dessus l'appli du Pixel.
  android:
    name: CCS Android
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      java: 17
      groups:
        - android_signature
    triggering:
      events: [tag]
      tag_patterns:
        - pattern: 'v*'
    scripts:
      - name: Clé de signature
        script: |
          mkdir -p "$HOME/.android"
          echo "$CCS_DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
      - name: Tests unitaires
        script: |
          cd android-app && ./gradlew --no-daemon testDebugUnitTest
      - name: APK de release
        script: |
          cd android-app && ./gradlew --no-daemon assembleRelease
    artifacts:
      - android-app/app/build/outputs/apk/release/app-release.apk
